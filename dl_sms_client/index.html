<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DL SMS CLIENT | Tactical Access</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff002b",
                        "bg-dark": "#050505",
                        "card-dark": "rgba(20, 20, 20, 0.9)",
                    },
                    fontFamily: { "sans": ["Outfit", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1a0508 0%, #050505 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .input-pill {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem;
            padding: 1rem 1.4rem;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }

        .input-pill:focus {
            border-color: #ff002b;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 0, 43, 0.15);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ff002b 0%, #8b0017 100%);
            border-radius: 9999px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.1em;
        }

        .btn-gradient:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 43, 0.4);
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(255, 0, 43, 0.5);
        }

        .noise {
            position: fixed;
            inset: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="w-full max-w-md px-6 animate-fadeIn">
        <div class="text-center mb-10">
            <img src="logo.svg" alt="Hub Logo"
                class="h-24 w-24 mx-auto mb-6 drop-shadow-[0_0_20px_rgba(255,0,43,0.4)] rounded-full">
            <h1 class="text-4xl font-black uppercase tracking-tighter glow-text">DL SMS <span
                    class="text-primary">CLIENT</span></h1>
            <p class="text-gray-400 text-sm mt-2 font-medium">Virtual Phone Number Management</p>
        </div>

        <div class="glass-card p-8 md:p-10">
            <form id="loginForm" class="space-y-6">
                <div class="space-y-4">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] ml-2">Member
                        ID</label>
                    <input required id="memberId" type="text" placeholder="ENTER YOUR ID"
                        class="input-pill text-center uppercase" />
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] ml-2">Security
                        PIN</label>
                    <input required id="memberPin" type="password" maxlength="6" placeholder="******"
                        class="input-pill text-center tracking-[1em]" />
                </div>

                <button type="submit"
                    class="w-full py-4 btn-gradient text-white flex items-center justify-center gap-2">
                    <span class="material-symbols-rounded text-lg">verified_user</span>
                    Login to Hub
                </button>
            </form>
        </div>

        <p class="text-center mt-8 text-[10px] font-black text-white/20 uppercase tracking-[0.4em]">Proprietary Legion
            Software</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAfgn6EhQjlrM4KrxMsLt8JFZLN1xQ2qQ",
            authDomain: "demoxhexa.firebaseapp.com",
            projectId: "demoxhexa",
            storageBucket: "demoxhexa.firebasestorage.app",
            messagingSenderId: "1003743776194",
            appId: "1:1003743776194:web:771ea255d6ff2229b1da5b",
            measurementId: "G-GKNQ27DHDR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const memberIdInput = document.getElementById('memberId');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const memberId = memberIdInput.value.trim().toUpperCase();
            const submitBtn = loginForm.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></span> AUTHENTICATING...';

            try {
                const memberPin = document.getElementById('memberPin').value;

                // Bypass for master
                if (memberId === 'DEMOXHEXA' && memberPin === '000000') {
                    sessionStorage.setItem('dl_sms_auth', JSON.stringify({ memberId: 'demoxhexa', nickname: 'COMMANDER' }));
                    window.location.href = 'client.html';
                    return;
                }

                // Check Applications
                const q = query(collection(db, "applications"), where("id", "==", memberId));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    const data = snap.docs[0].data();
                    if (data.status !== 'Approved') throw new Error("Account pending approval.");
                    sessionStorage.setItem('dl_sms_auth', JSON.stringify({ memberId: data.id, nickname: data.nickname }));
                    window.location.href = 'client.html';
                    return;
                }

                // Check Admins
                const adminRef = doc(db, "admins", memberId.toLowerCase());
                const adminSnap = await getDoc(adminRef);
                if (adminSnap.exists()) {
                    const data = adminSnap.data();
                    sessionStorage.setItem('dl_sms_auth', JSON.stringify({ memberId: memberId.toLowerCase(), nickname: data.name || 'Admin' }));
                    window.location.href = 'client.html';
                    return;
                }

                throw new Error("Access Denied: Invalid ID");
            } catch (err) {
                alert(err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-symbols-rounded text-lg">verified_user</span> Verify Identity';
            }
        });

        if (sessionStorage.getItem('dl_sms_auth')) window.location.href = 'client.html';
    </script>
</body>

</html>
