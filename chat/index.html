<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Deathly Chat | Secure Comms</title>
    <link rel="icon" type="image/png" href="../logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../encryption_vault.js"></script>
    <script type="module" src="../protection.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, getDoc, query, where, orderBy, limit, doc, onSnapshot, updateDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAfgn6EhQjlrM4KrxMsLt8JFZLN1xQ2qQ",
            authDomain: "demoxhexa.firebaseapp.com",
            projectId: "demoxhexa",
            storageBucket: "demoxhexa.firebasestorage.app",
            messagingSenderId: "1003743776194",
            appId: "1:1003743776194:web:771ea255d6ff2229b1da5b",
            measurementId: "G-GKNQ27DHDR"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.firebaseChat = { db, collection, addDoc, serverTimestamp, getDocs, getDoc, query, where, orderBy, limit, doc, onSnapshot, updateDoc, setDoc, deleteDoc };
    </script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff002b",
                        "primary-glow": "rgba(255, 0, 43, 0.4)",
                        "bg-dark": "#050505",
                        "card-dark": "rgba(20, 20, 20, 0.9)",
                        "border-white": "rgba(255, 255, 255, 0.08)",
                        "sidebar-dark": "#0a0a0a",
                        "chat-bg": "#0d0d0d",
                        "bubble-self": "#ff002b",
                        "bubble-other": "#1a1a1a"
                    },
                    fontFamily: {
                        "sans": ["Outfit", "sans-serif"],
                    }
                },
            },
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-bg-dark text-white overflow-hidden">
    <!-- Page Loader -->
    <div id="loader"
        class="fixed inset-0 z-50 flex items-center justify-center bg-bg-dark transition-opacity duration-500">
        <div class="relative">
            <img src="../logo.png" class="w-20 h-20 rounded-full animate-pulse-ring" alt="Logo">
            <div class="absolute -inset-4 border-2 border-primary/20 rounded-full animate-spin-slow"></div>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="login-overlay"
        class="fixed inset-0 z-40 flex items-center justify-center bg-bg-dark/95 backdrop-blur-xl hidden">
        <div class="glass-card p-10 max-w-md w-full text-center space-y-8 animate-scale-in">
            <img src="../logo.png" class="w-16 h-16 mx-auto rounded-full shadow-lg shadow-primary/20" alt="Logo">
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter">Secure <span
                        class="text-primary italic">Comms</span></h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-2">Authorized Personnel Only
                </p>
            </div>
            <div class="space-y-4">
                <input type="text" id="member-id" placeholder="Enter Member ID (e.g. DL-XXXXXX)"
                    class="input-pill w-full text-center">
                <button onclick="verifyMember()"
                    class="btn-primary w-full py-4 rounded-2xl font-black uppercase text-xs tracking-widest">
                    Request Access
                </button>
                <p id="login-error" class="text-primary text-[10px] font-black uppercase hidden">Invalid ID or Not
                    Approved</p>
            </div>
            <p class="text-[9px] text-gray-600 uppercase font-medium">Verify your membership status in the main portal
            </p>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="main-interface" class="flex h-screen w-full opacity-0 transition-opacity duration-1000">
        <!-- Sidebar -->
        <aside class="w-80 lg:w-96 bg-sidebar-dark border-r border-white/5 flex flex-col relative z-20">
            <!-- Sidebar Header -->
            <div class="p-6 border-b border-white/5 space-y-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img id="user-avatar" src="../logo.png" class="w-10 h-10 rounded-full border border-primary/20"
                            alt="User">
                        <div>
                            <p id="user-name" class="text-sm font-black text-white uppercase tracking-tight">Loading...
                            </p>
                            <div class="flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 bg-green-500 rounded-full shadow-[0_0_5px_#22c55e]"></span>
                                <span
                                    class="text-[8px] font-black text-gray-500 uppercase tracking-widest">Online</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="logout()"
                        class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-red-500/10 hover:text-red-500 transition-all">
                        <span class="material-symbols-rounded text-xl">logout</span>
                    </button>
                </div>

                <div class="relative">
                    <span
                        class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">search</span>
                    <input type="text" id="chat-search" placeholder="Search members..."
                        class="w-full bg-white/5 border border-white/5 rounded-full py-3 pl-12 pr-6 text-xs text-white focus:border-primary/50 transition-all">
                </div>
            </div>

            <!-- Chat List -->
            <div id="chat-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <!-- Chat Items will be injected here -->
                <div class="animate-pulse flex flex-col p-4 gap-4">
                    <div class="flex gap-4">
                        <div class="w-12 h-12 bg-white/5 rounded-full"></div>
                        <div class="flex-1 space-y-2 py-1">
                            <div class="h-2 bg-white/5 rounded w-3/4"></div>
                            <div class="h-2 bg-white/5 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="flex-1 flex flex-col bg-chat-bg relative">
            <!-- Empty State -->
            <div id="empty-chat"
                class="absolute inset-0 z-10 flex flex-col items-center justify-center text-center space-y-6 animate-fade-in">
                <div class="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mb-4">
                    <span class="material-symbols-rounded text-5xl text-gray-700 animate-float">chat_bubble</span>
                </div>
                <div>
                    <h2 class="text-xl font-black text-white uppercase tracking-tighter">Initialize Tactical Link</h2>
                    <p class="text-xs text-gray-600 uppercase tracking-widest mt-1">Select a member to begin secure
                        transmission</p>
                </div>
            </div>

            <!-- Active Chat -->
            <div id="active-chat"
                class="flex flex-col h-full opacity-0 transition-opacity duration-300 pointer-events-none">
                <!-- Chat Header -->
                <header
                    class="p-4 lg:p-6 border-b border-white/5 bg-sidebar-dark/50 backdrop-blur-md flex items-center justify-between z-10">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <img id="active-user-avatar" src="../logo.png"
                                class="w-12 h-12 rounded-2xl border border-white/10" alt="Contact">
                            <div
                                class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-2 border-chat-bg rounded-full">
                            </div>
                        </div>
                        <div>
                            <h3 id="active-user-name" class="text-lg font-black text-white uppercase tracking-tight">
                                Loading...</h3>
                            <p id="active-user-status"
                                class="text-[9px] font-black text-primary uppercase tracking-[0.2em] animate-pulse">
                                Establishing Connection...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button
                            class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400">
                            <span class="material-symbols-rounded">phone</span>
                        </button>
                        <button
                            class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400">
                            <span class="material-symbols-rounded">videocam</span>
                        </button>
                        <button
                            class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400">
                            <span class="material-symbols-rounded">more_vert</span>
                        </button>
                    </div>
                </header>

                <!-- Messages -->
                <div id="message-container" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar scroll-smooth">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Input Area -->
                <footer class="p-6 bg-sidebar-dark/30 backdrop-blur-xl border-t border-white/5">
                    <form id="chat-form" class="flex items-center gap-4">
                        <div class="flex gap-2">
                            <button type="button"
                                class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center hover:bg-primary/20 hover:text-primary transition-all text-gray-500">
                                <span class="material-symbols-rounded">attach_file</span>
                            </button>
                        </div>
                        <div class="flex-1 relative">
                            <input type="text" id="message-input" placeholder="Type a secure message..."
                                class="w-full bg-white/5 border border-white/5 rounded-2xl py-4 px-6 text-sm text-white focus:border-primary/50 transition-all outline-none">
                            <button type="button"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-primary p-1 transition-colors">
                                <span class="material-symbols-rounded text-xl">mood</span>
                            </button>
                        </div>
                        <button type="submit"
                            class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-xl shadow-primary/20 group">
                            <span
                                class="material-symbols-rounded group-hover:translate-x-1 transition-transform">send</span>
                        </button>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js" type="module"></script>
</body>

</html>
